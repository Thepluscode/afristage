# Every image, runtime and service version is pinned exactly (Dockerfiles,
# docker-compose.yml, CI service containers, setup-node). Pins do not patch
# themselves: this proposes the updates once a month, grouped, so upgrading is a
# reviewed PR on a schedule rather than whatever `latest` resolved to on deploy.
# Security advisories are not held for the schedule — GitHub raises those as
# they are published.
version: 2
updates:
  - package-ecosystem: docker
    directories: ["/apps/api", "/apps/web", "/apps/admin-web", "/apps/mobile"]
    schedule: { interval: monthly }
    groups: { base-images: { patterns: ["*"] } }
    ignore:
      # Node majors move only to an LTS line, by hand, together with CI and
      # @types/node. nginx odd minors are mainline; stay on the stable branch.
      - dependency-name: node
        update-types: ["version-update:semver-major"]
      - dependency-name: nginx
        update-types: ["version-update:semver-minor"]
  - package-ecosystem: docker-compose
    directory: "/"
    schedule: { interval: monthly }
    groups: { local-stack: { patterns: ["*"] } }
    ignore:
      # A Postgres major strands existing local volumes (dump/restore, not a
      # tag bump). Redis tracks the deployed 8.2 line.
      - dependency-name: postgres
        update-types: ["version-update:semver-major"]
      - dependency-name: redis
        update-types: ["version-update:semver-minor", "version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: "/"
    schedule: { interval: monthly }
    groups: { actions: { patterns: ["*"] } }
  - package-ecosystem: npm
    directory: "/"
    schedule: { interval: monthly }
    groups:
      # NestJS packages must share a major; one at a time they cannot build
      # (#292: @nestjs/common 12 alone failed build-test). Listed first so
      # @nestjs/* majors land here, together, rather than one PR each.
      nestjs: { patterns: ["@nestjs/*"] }
      npm-minor-patch: { update-types: ["minor", "patch"] }
    open-pull-requests-limit: 5
    ignore:
      # Types must describe the runtime we ship (node:22 in every Dockerfile);
      # moving them past it types APIs that do not exist in production.
      # Raise this together with the base image.
      - dependency-name: "@types/node"
        versions: [">=23"]
