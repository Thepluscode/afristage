# Q1 — outside-in synthetic health check ("a system that calls you").
# A service serves its health route from INSIDE its own network, so it cannot tell you the
# platform is unreachable to real users. This probes the DEPLOYED public API from OUTSIDE,
# on a schedule, and fails the job (+ POSTs a Slack alert) when a beta-critical path is down.
#
# Runs tools/monitoring/beta-uptime.sh → three probes: /api/health, /live-rooms (servable),
# and the ledger-integrity metric. Catches an API crash/deploy-fail the in-API @Crons can't.
#
# CAVEAT (honest): GitHub-hosted runners are region-limited (mostly US) — catches TOTAL
# outages, not region-specific ones, and can't see a total-GitHub outage. Pair with a free
# external uptime service on /api/health for belt-and-suspenders.
#
# Setup (repo Settings): Secret ALERT_WEBHOOK = Slack inbound webhook.
#   (optional) Variable AFRISTAGE_MONITOR_BASE = https://<api-host>/api  — defaults to staging.
# NOTE: scheduled workflows only run when GitHub Actions billing is enabled for this repo.

name: synthetic-check
on:
  schedule:
    - cron: "*/5 * * * *"      # every 5 min (GitHub minimum for scheduled workflows)
  workflow_dispatch: {}

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.x" }
      - name: outside-in probe (health + live-rooms + ledger integrity)
        # Config via env (never interpolated into the shell).
        env:
          AFRISTAGE_MONITOR_BASE: ${{ vars.AFRISTAGE_MONITOR_BASE }}   # optional; script defaults to staging
          UPTIME_ALERT_WEBHOOK_URL: ${{ secrets.ALERT_WEBHOOK }}
          REGION: gh-actions
        run: bash tools/monitoring/beta-uptime.sh
