name: Web & Mobile CI

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - "apps/admin-web/**"
      # apps/web matched NO workflow's filter until 2026-09-22. Its suite had
      # never run in CI — every web change merged on a local run alone, and the
      # public client is the one users actually touch.
      - "apps/web/**"
      - "apps/mobile/**"
      - ".github/workflows/web-mobile-ci.yml"
  workflow_dispatch:

jobs:
  admin-web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.2
      - run: npm install
      - name: Test admin web (vitest + RTL, 100% coverage)
        run: npm run test -w apps/admin-web
      - name: Build admin web (Next.js production build = typecheck + compile)
        run: npm run build -w apps/admin-web

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.2
      - run: npm install
      - name: Test web client (vitest)
        run: npm run test -w apps/web
      - name: Build web client (Next.js production build = typecheck + compile)
        run: npm run build -w apps/web

  mobile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.2"
          channel: stable
      - working-directory: apps/mobile
        run: flutter pub get
      - name: Analyze (static analysis, fails on any issue)
        working-directory: apps/mobile
        run: flutter analyze
      - name: Widget tests
        working-directory: apps/mobile
        run: flutter test
      - name: Build web (full dart2js compile of the whole app)
        working-directory: apps/mobile
        run: flutter build web --release
