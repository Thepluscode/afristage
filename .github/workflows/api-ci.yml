name: API CI

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - "apps/api/**"
      - "scripts/**"
      - ".github/workflows/api-ci.yml"
      # One lockfile serves every workspace. A dependency-only PR (Dependabot,
      # npm audit fix) touched no app path and ran no CI at all (#288, 2026-09-24).
      - "package.json"
      - "package-lock.json"
      - "FEATURE_TRACKER.md" # the tracker lint guards this file, so edits to it must run
  workflow_dispatch:

jobs:
  build-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18.6
        env:
          POSTGRES_USER: afristage
          POSTGRES_PASSWORD: afristage
          POSTGRES_DB: afristage_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5
      redis:
        image: redis:8.2.10
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      DATABASE_URL: postgresql://afristage:afristage@localhost:5432/afristage_test?schema=public
      REDIS_URL: redis://localhost:6379
      JWT_ACCESS_SECRET: ci_access_secret
      JWT_REFRESH_SECRET: ci_refresh_secret
      LIVEKIT_API_KEY: devkey
      LIVEKIT_API_SECRET: ci_livekit_secret
      LIVEKIT_URL: ws://localhost:7880
      PAYSTACK_SECRET_KEY: sk_test_phase4_secret # validate-hardening signs webhooks with this
      # Coins are sold in fixed server-priced packages, so no creator can reach the
      # 1,000,000-coin production fraud threshold through the real purchase API.
      # Lower it here so validate:observability-fraud actually exercises the hold.
      FRAUD_LARGE_PAYOUT_COIN: "2000"
      API_BASE: http://localhost:3000/api
      WS_BASE: http://localhost:3000/chat
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22.23.2
      - run: npm install
      - run: npm run prisma:generate -w apps/api
      # Cheap and stack-free, so it runs before anything expensive: rejects a
      # status label that isn't in the vocabulary, and any VERIFIED/PILOT-READY/
      # PRODUCTION-READY claim with no evidence behind it.
      - run: npm run test:tracker-lint
      - run: npm run validate:tracker
      # The deploy job's verification is CI-only shell, so this is the only thing
      # that ever proves it rejects a stale deployment. Runs on every PR, not just
      # main, so the guard cannot quietly break between deploys.
      - run: npm run test:deploy-verify
      # Every `run:` block must be valid shell. A stray quote after a `fi` shipped
      # on 2026-09-22: YAML parsed, review passed, and it failed only in CI after
      # the deploy had already happened — so the step meant to PROVE the deploy
      # is what looked broken. `bash -n` catches it in under a second.
      - run: npm run validate:workflows
      - run: npm run lint -w apps/api # typecheck
      - run: npm run test -w apps/api # unit (ledger invariants)
      - run: npm run build -w apps/api
      - run: npx prisma migrate deploy --schema apps/api/prisma/schema.prisma
      - run: npm run seed -w apps/api

      - name: E2E — functional suites (rate limiting off)
        run: |
          # NODE_ENV=test is load-bearing since security gates fail closed on an
          # UNSET value: these suites sign in as the seeded accounts, which are
          # refused anywhere that is not explicitly development or test. CI used
          # to pass only because unset read as "not production" — the same
          # permissiveness that left mock payments open in production.
          NODE_ENV=test THROTTLE_DISABLED=true node apps/api/dist/src/main.js & echo $! > /tmp/api.pid
          for i in $(seq 1 30); do curl -fsS "$API_BASE/health" >/dev/null 2>&1 && break; sleep 2; done
          set -e
          npm run validate:money
          npm run validate:marketplace
          npm run validate:seller-withdrawal
          npm run validate:cross-user
          npm run validate:correlation-id
          npm run validate:moderation
          npm run validate:moderation-ops
          npm run validate:security
          npm run validate:observability-fraud
          npm run validate:beta
          npm run validate:admin-backend
          npm run validate:ranking
          npm run validate:room-events
          npm run validate:ux-readiness
          npm run smoke:closed-beta
          npm run validate:ux-timing
          kill "$(cat /tmp/api.pid)" || true

      - name: E2E — hardening suite (rate limiting on)
        run: |
          NODE_ENV=test node apps/api/dist/src/main.js & echo $! > /tmp/api.pid
          for i in $(seq 1 30); do curl -fsS "$API_BASE/health" >/dev/null 2>&1 && break; sleep 2; done
          set -e
          npm run validate:hardening
          kill "$(cat /tmp/api.pid)" || true

  # Ship what just passed.
  #
  # Until 2026-09-05 nothing here deployed anything: `docs/runbook.md` documented
  # a human typing `railway up`, and the deployed API drifted roughly four weeks
  # behind main — #236, #242, the ledger and SIGTERM fixes all merged and none of
  # them live. The scheduled synthetic-check went green throughout, because it was
  # probing the stale build. A green check on main proved nothing about main.
  #
  # `needs: build-test` makes this the same run that ran the tests, so there is no
  # window where a deploy can be triggered by a commit whose suite never passed.
  deploy:
    needs: build-test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    # Deploys are serialised and never cancelled midway: two `railway up`s racing
    # would leave whichever finished last live, which may not be the newer commit.
    concurrency:
      group: deploy-railway
      cancel-in-progress: false
    env:
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
      API_HEALTH_URL: https://api-production-e12f.up.railway.app/api/health
      WEB_BASE_URL: https://web-production-4ee7e.up.railway.app
      FLUTTER_WEB_URL: https://flutter-web-production-b292.up.railway.app
    steps:
      # depth 2, not the default 1: the flutter-web gate diffs HEAD against its
      # first parent, and with a shallow clone that parent does not exist —
      # `git diff` would error and take a working deploy down with it.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2

      # Fail with a sentence someone can act on, rather than letting the CLI emit
      # "Unauthorized" and exit 0 — which is exactly how a deploy silently does
      # nothing while the pipeline stays green.
      - name: Require the deploy credential
        run: |
          if [ -z "$RAILWAY_TOKEN" ]; then
            echo "::error::RAILWAY_TOKEN is not set. Add it under Settings → Secrets and variables → Actions."
            exit 1
          fi

      - name: Install Railway CLI
        run: npm i -g @railway/cli@4

      # Stamped so the deployed process can say which commit it is. The verify
      # step below is only meaningful because of this.
      # --skip-deploys: setting a variable normally triggers its own redeploy, which
      # would race the `railway up` below and could leave the older image live.
      - name: Stamp the commit onto the API service
        run: railway variable set "GIT_SHA=$GITHUB_SHA" --service api --skip-deploys

      # Same stamp on the web client, so its deploy is verifiable too rather than
      # "something answered 200". Runtime variable, not a build arg: the health
      # route reads process.env at request time, exactly as the API does.
      - name: Stamp the commit onto the web service
        run: railway variable set "GIT_SHA=$GITHUB_SHA" --service web --skip-deploys

      # flutter-web is a static nginx image with no server to read env per
      # request — but its entrypoint runs envsubst over the config template at
      # container start, so this runtime variable reaches the health response
      # without depending on build args being propagated.
      - name: Stamp the commit onto the flutter-web service
        run: railway variable set "GIT_SHA=$GITHUB_SHA" --service flutter-web --skip-deploys

      - name: Deploy api
        run: railway up --service api --ci

      - name: Deploy admin-web
        run: railway up --service admin-web --ci

      # The public web client. Left out until 2026-09-22, and it bit exactly as
      # you would expect: #254 shipped a password-reset EMAIL whose link pointed
      # at /reset-password on this service, the API deployed, the page did not,
      # and the link 404'd. The deploy job reported success throughout, because
      # it had never been asked to deploy the service the change was about.
      - name: Deploy web
        run: railway up --service web --ci

      # flutter-web is the expensive one — a full Flutter toolchain build, minutes
      # per run — and the vast majority of merges do not touch it. Deploy it only
      # when apps/mobile actually changed, and say so either way rather than
      # skipping silently.
      - name: Deploy flutter-web (only when the mobile app changed)
        run: |
          set -euo pipefail
          # HEAD^ is the previous main tip (first parent of the merge commit).
          # If it is missing for any reason, deploy rather than skip: a needless
          # build costs minutes, a skipped one ships a client that isn't there.
          if ! git rev-parse --verify HEAD^ >/dev/null 2>&1; then
            echo "no parent commit available -> deploying flutter-web to be safe"
            railway up --service flutter-web --ci
          elif git diff --name-only HEAD^ HEAD -- apps/mobile | grep -q .; then
            echo "apps/mobile changed -> deploying flutter-web"
            railway up --service flutter-web --ci
          else
            echo "apps/mobile unchanged -> skipping flutter-web (previous build stays live)"
          fi

      # The step that makes this a deploy rather than an upload. The logic lives
      # in the script so scripts/deploy-verify-selftest.sh can prove it rejects a
      # stale deployment — a check never observed failing is decoration.
      - name: Verify the deployed commit is this commit
        run: bash scripts/verify-deployed-commit.sh "$API_HEALTH_URL" "$GITHUB_SHA" 60 10

      # Same check, same script, same strength as the API's: the web client now
      # reports its commit too, so this proves THIS commit is live rather than
      # "something answered 200" — the weaker check that let a stale client sit
      # behind a green pipeline.
      - name: Verify the deployed web client is this commit
        run: bash scripts/verify-deployed-commit.sh "$WEB_BASE_URL/api/health" "$GITHUB_SHA" 60 10

      # Same standard as the other two now that the image carries its commit.
      # Skipped when the service was not deployed, because re-probing an
      # untouched service proves nothing about this run.
      - name: Verify the deployed flutter-web is this commit (only when it was deployed)
        run: |
          set -euo pipefail
          if ! git rev-parse --verify HEAD^ >/dev/null 2>&1 || git diff --name-only HEAD^ HEAD -- apps/mobile | grep -q .; then
            bash scripts/verify-deployed-commit.sh "$FLUTTER_WEB_URL/api/health" "$GITHUB_SHA" 60 10

            # A deployed fix a browser never fetches is not deployed. Without
            # Cache-Control these were served from disk with no revalidation,
            # and Flutter's service worker kept the stale bundle alive on top of
            # that. Asserting the header here because the symptom — a user on an
            # old build — looks exactly like a fix that did not work.
            for f in index.html main.dart.js flutter_service_worker.js; do
              cc="$(curl -fsSI --max-time 20 "$FLUTTER_WEB_URL/$f" | tr -d '\r' | grep -i '^cache-control:' || true)"
              case "$cc" in
                *no-cache*) echo "ok: $f -> $cc" ;;
                *) echo "FAIL: $f must send Cache-Control: no-cache, got '${cc:-<none>}'" >&2; exit 1 ;;
              esac
            done
          else
            echo "flutter-web not deployed this run -> nothing to verify"
          fi
